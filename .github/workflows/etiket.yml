# main dalındaki "vX.Y.Z: ..." ile başlayan her commit için aynı adlı git etiketi atar.
# Etiketi zaten olan commit'lere dokunmaz. Böylece sürüm etiketleri elle atılmak zorunda kalmaz.
name: Sürüm etiketi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  etiketle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Eksik etiketleri at
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git log --reverse --format='%H %s' | while read -r sha konu; do
            surum=$(printf '%s' "$konu" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+' || true)
            [ -z "$surum" ] && continue
            if git rev-parse -q --verify "refs/tags/$surum" >/dev/null; then
              echo "$surum zaten var"
              continue
            fi
            git tag -a "$surum" "$sha" -m "$konu"
            git push origin "refs/tags/$surum"
            echo "$surum -> $sha"
          done
