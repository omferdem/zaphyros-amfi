# main dalındaki "vX.Y.Z: ..." ile başlayan her commit için aynı adlı git etiketi atar.
# Etiketi zaten olan commit'lere dokunmaz. Böylece sürüm etiketleri elle atılmak zorunda kalmaz.
# Not: GITHUB_TOKEN, workflow dosyası değiştiren commit'lere "git push" ile etiket atamaz;
# bu yüzden etiketler GitHub API'siyle oluşturulur.
name: Sürüm etiketi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  etiketle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Eksik etiketleri at
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hata=0
          while read -r sha konu; do
            surum=$(printf '%s' "$konu" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+' || true)
            [ -z "$surum" ] && continue
            if git rev-parse -q --verify "refs/tags/$surum" >/dev/null; then
              echo "$surum zaten var"
              continue
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$surum" -f sha="$sha" >/dev/null; then
              echo "$surum -> $sha"
            else
              echo "::error::$surum etiketi atılamadı"
              hata=1
            fi
          done < <(git log --reverse --format='%H %s')
          exit $hata
