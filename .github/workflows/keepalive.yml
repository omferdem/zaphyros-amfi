# Supabase Free projeleri 7 gün "yeterli hareket" görmezse duraklatılır.
# Bu iş akışı iki günde bir uyandir() fonksiyonunu çağırır: küçük bir tabloya yazar ve dersler ile öğrenciler
# tablolarını okar. (Eski sürüm yalnızca saglik() çağırıyordu; o hiçbir tabloya dokunmadığı için Supabase
# bunu hareket saymadı ve proje duraklatma uyarısı aldı.)
# Adres ve anahtar public/ayarlar.json dosyasından okunur (herkese açık değerlerdir, gizli değildir).
# Not: GitHub, 60 gün boyunca depoya hiç commit atılmazsa zamanlanmış iş akışlarını kendiliğinden kapatır;
# bir kapanma e-postası gelirse Actions sekmesinden bu iş akışını yeniden aç.
name: Supabase uyandırma

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  uyandir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: public/ayarlar.json
          sparse-checkout-cone-mode: false
      - name: uyandir() fonksiyonunu çağır
        run: |
          SUPABASE_URL=$(jq -r .supabaseUrl public/ayarlar.json)
          SUPABASE_KEY=$(jq -r .supabaseKey public/ayarlar.json)
          yanit=$(curl -sS -w '\n%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/uyandir" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "$yanit"
          kod=$(echo "$yanit" | tail -n1)
          govde=$(echo "$yanit" | sed '$d')
          test "$kod" = "200"
          echo "$govde" | jq -e '.tamam == true'
