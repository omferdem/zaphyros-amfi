# Supabase Free projeleri 7 gün hareketsiz kalınca duraklatılır.
# Bu iş akışı iki günde bir veritabanında küçük bir sorgu çalıştırarak bunu önler.
# Adres ve anahtar public/ayarlar.json dosyasından okunur (herkese açık değerlerdir, gizli değildir).
name: Supabase uyandırma

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  uyandir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: public/ayarlar.json
          sparse-checkout-cone-mode: false
      - name: saglik() fonksiyonunu çağır
        run: |
          SUPABASE_URL=$(jq -r .supabaseUrl public/ayarlar.json)
          SUPABASE_KEY=$(jq -r .supabaseKey public/ayarlar.json)
          yanit=$(curl -sS -w '\n%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/saglik" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "$yanit"
          kod=$(echo "$yanit" | tail -n1)
          test "$kod" = "200"
